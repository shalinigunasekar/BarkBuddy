{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h3 class="text-danger">Delete Listing?</h3>
                    <p>Are you sure you want to remove <strong>{{ dog.name }}</strong> from BarkBuddy?</p>
                    <p class="text-muted small">This action cannot be undone.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                        <a href="{% url 'dogs:dog_detail' dog.pk %}" class="btn btn-secondary px-4">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
